name: TreeCapitator
main: main.TreeCapitator
author: RdrSeraphim
version: B6.5.04
api-version: 1.13
commands:
  tc:
   description: Controls TreeCapitator and gives information.
   aliases: [treecapitator, treecap]
   usage: /tc help
   
permissions:
  treecapitator.*:
    description: Gives access to all Tree Capitator commands.
    children:
      treecapitator.admin: true
      treecapitator.user: true
      treecapitator.vip: true
  treecapitator.admin:
    description: Allows you to change configuration values and update to the latest build.
    default: op
  treecapitator.user:
    description: Allows you to cut down trees faster! Quite faster in fact.
    default: true
  treecapitator.vip:
    description: Allows you to cut down trees at once even if VIP MODE is enabled.
    default: false